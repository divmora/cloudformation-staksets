AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sets IAM Password Policy and Config Rule across all accounts'

Parameters:
  MinimumPasswordLength:
    Type: String
    Default: "14"
    Description: "Minimum length of the password"
  RequireUppercaseCharacters:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Require at least one uppercase character"
  RequireLowercaseCharacters:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Require at least one lowercase character"
  RequireNumbers:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Require at least one number"
  RequireSymbols:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Require at least one symbol"
  MaxPasswordAge:
    Type: String
    Default: "60"
    Description: "Number of days before passwords expire"
  PasswordReusePrevention:
    Type: String
    Default: "5"
    Description: "Number of previous passwords to remember"
  AllowUsersToChangePassword:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Allow all users to change their own passwords"
  HardExpiry:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Prevent users from setting a new password after their password has expired"

Resources:

  # 1. Sets the ACTUAL password policy in the account
  IAMPasswordPolicyCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt PasswordPolicyFunction.Arn
      MinimumPasswordLength: !Ref MinimumPasswordLength
      RequireUppercaseCharacters: !Ref RequireUppercaseCharacters
      RequireLowercaseCharacters: !Ref RequireLowercaseCharacters
      RequireNumbers: !Ref RequireNumbers
      RequireSymbols: !Ref RequireSymbols
      MaxPasswordAge: !Ref MaxPasswordAge
      PasswordReusePrevention: !Ref PasswordReusePrevention
      AllowUsersToChangePassword: !Ref AllowUsersToChangePassword
      HardExpiry: !Ref HardExpiry

  # 2. Lambda function to apply the password policy
  PasswordPolicyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: SetIAMPasswordPolicy
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
            iam = boto3.client('iam')
            try:
              if event['RequestType'] in ['Create', 'Update']:
                props = event['ResourceProperties']
                iam.update_account_password_policy(
                  MinimumPasswordLength=int(props['MinimumPasswordLength']),
                  RequireUppercaseCharacters=props['RequireUppercaseCharacters'] == 'true',
                  RequireLowercaseCharacters=props['RequireLowercaseCharacters'] == 'true',
                  RequireNumbers=props['RequireNumbers'] == 'true',
                  RequireSymbols=props['RequireSymbols'] == 'true',
                  MaxPasswordAge=int(props['MaxPasswordAge']),
                  PasswordReusePrevention=int(props['PasswordReusePrevention']),
                  AllowUsersToChangePassword=props['AllowUsersToChangePassword'] == 'true',
                  HardExpiry=props['HardExpiry'] == 'true'
                )
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
            except Exception as e:
              print(e)
              cfnresponse.send(event, context, cfnresponse.FAILED, {})

  # 3. Updates the Config Rule parameters
  IAMPasswordPolicyConfigRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: iam-password-policy
      Source:
        Owner: AWS
        SourceIdentifier: IAM_PASSWORD_POLICY
      InputParameters:
        RequireUppercaseCharacters: !Ref RequireUppercaseCharacters
        RequireLowercaseCharacters: !Ref RequireLowercaseCharacters
        RequireSymbols: !Ref RequireSymbols
        RequireNumbers: !Ref RequireNumbers
        MinimumPasswordLength: !Ref MinimumPasswordLength
        PasswordReusePrevention: !Ref PasswordReusePrevention
        MaxPasswordAge: !Ref MaxPasswordAge

  # 4. IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaIAMPasswordPolicyRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IAMPasswordPolicyAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:UpdateAccountPasswordPolicy
                  - iam:GetAccountPasswordPolicy
                Resource: "*"
